# wf's checks for GitLab CI. A project includes this file from the release it is attached to, in its
# own .gitlab-ci.yml; the README says how. Every job runs in the test stage.
#
# The jobs that run wf download the version .wf.yml pins and check it against .wf.sum before
# running it. A component's jobs run only in a project that has it, and only when a path that can
# change their result changed. A project changes a job's rules, needs, stage or image by naming
# the job in its own file. The hidden jobs are named .wf:… so they never merge with a project's own.

.wf:install:
  image: alpine:3.22
  # A job with no rules is left out of merge request pipelines.
  rules:
    - when: on_success
  before_script:
    - |
      set -e
      version=$(sed -n 's/^wf:\([^#]*\).*/\1/p' .wf.yml | tr -d "\"' \t\r")
      case $(uname -m) in
        x86_64) arch=amd64 ;;
        aarch64 | arm64) arch=arm64 ;;
        *) echo "wf has no release for $(uname -m)"; exit 1 ;;
      esac
      archive="wf_${version}_linux_${arch}.tar.gz"
      [ -f .wf.sum ] || { echo "there is no .wf.sum: run wf lock and commit .wf.sum"; exit 1; }
      sum=$(awk -v archive="$archive" '$1 == archive { sub(/^sha256:/, "", $2); print $2 }' .wf.sum)
      if [ -z "$sum" ]; then echo ".wf.sum has no $archive: run wf lock and commit .wf.sum"; exit 1; fi
      wget -qO "/tmp/$archive" "https://github.com/workflowaiorg/workflow/releases/download/v$version/$archive"
      echo "$sum  /tmp/$archive" | sha256sum -c -
      tar -xzf "/tmp/$archive" -C /usr/local/bin wf

# The files wf writes match .agents and .wf.yml.
wf:sync:
  extends: .wf:install
  script:
    - wf sync --check

# The specs, the decision records and their index agree.
wf:spec-coverage:
  extends: .wf:install
  script:
    - wf spec-coverage

# Fails on a change to a service's openapi.yaml that breaks a client of the target branch's copy,
# unless the merge request carries the api-passthrough label; the api-design skill has the rules.
# GitLab reads labels when a pipeline starts: after adding the label, run the pipeline again. It
# runs in merge request pipelines only: a branch or default-branch pipeline has no labels to read,
# so a break accepted on purpose would fail there. It is no gate step: it needs the labels.
openapi:breaking:
  image:
    name: tufin/oasdiff:v1.35.0
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - exists: [go.mod]
      changes: ["*/openapi.yaml"]
  script:
    - |
      set -e
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      # Against the commit the merge request started from, so a change merged since does not read
      # as one this branch made.
      git fetch --depth=1 origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      case ",$CI_MERGE_REQUEST_LABELS," in
        *,api-passthrough,*) passthrough=true ;;
        *) passthrough=false ;;
      esac
      failed=0
      for document in */openapi.yaml; do
        [ -e "$document" ] || continue
        if ! git cat-file -e "FETCH_HEAD:$document" 2>/dev/null; then
          echo "$document is new: nothing to compare against."
          continue
        fi
        git show "FETCH_HEAD:$document" > /tmp/base.yaml
        if [ "$passthrough" = true ]; then
          echo "api-passthrough: the breaks in $document below are accepted with this merge request."
          oasdiff breaking /tmp/base.yaml "$document"
        else
          oasdiff breaking /tmp/base.yaml "$document" --fail-on ERR || failed=1
        fi
      done
      exit $failed

# The backend component: the steps of its gate.
.wf:backend:
  image: golang:1.25
  variables:
    # The golang images never fetch the newer Go a go.mod may ask for; this lets them.
    GOTOOLCHAIN: auto

backend:go-format:
  extends: .wf:backend
  rules:
    - exists: [go.mod]
      changes: ["**/*.go"]
  script:
    - gofmt -l .; test -z "$(gofmt -l .)"

backend:go-vet:
  extends: .wf:backend
  rules:
    - exists: [go.mod]
      changes: ["**/*.go", go.mod, go.sum]
  script:
    - go vet ./...

backend:go-test:
  extends: .wf:backend
  rules:
    - exists: [go.mod]
      changes: ["**/*.go", go.mod, go.sum, "*/openapi.yaml"]
  script:
    - go test ./...

# The frontend component: the steps of its gate, in web/.
.wf:frontend:
  image: node:24 # the major in web/package.json's engines
  before_script:
    - npm ci --prefix web

frontend:web-lint:
  extends: .wf:frontend
  rules:
    - exists: [web/package.json]
      changes: ["web/**", api/openapi.yaml]
  script:
    - cd web && npm run lint

frontend:web-typecheck:
  extends: .wf:frontend
  rules:
    - exists: [web/package.json]
      changes: ["web/**", api/openapi.yaml]
  script:
    - cd web && npm run typecheck

frontend:web-build:
  extends: .wf:frontend
  rules:
    - exists: [web/package.json]
      changes: ["web/**"]
  script:
    - cd web && npm run build
